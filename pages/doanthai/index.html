<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Quản lý Rạp Chiếu Phim</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="suatchieu.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../form-dialog.css">
  <link rel="stylesheet" href="../../control.css">
</head>
<body class="embedded">


<div class="main-wrapper">
  <main class="content" id="mainContent">
    <!-- nội dung trang ở đây -->
     <section>
      <article id="header">
        <h2>Quản lý suất chiếu</h2>
        <button id="add"><i class="bi bi-plus-lg" aria-hidden="true"></i> Thêm suất chiếu mới</button>
      </article>

      <article id="filter">
        <div class="filterSelections">
          <label for="showDate">Ngày chiếu:</label>
          <input type="date" id="showDate">
        </div>
        <div class="filterSelections">
          <label for="movie">Phim:</label>
          <select type="text" id="movie">
            <option value="">Tất cả phim:</option>
          </select>
        </div>
        <div class="filterSelections">
          <label for="cinema">Rạp chiếu:</label>
          <select type="text" id="cinema">
            <option value="">Tất cả rạp</option>
          </select>
        </div>
        <div>
          <button type="reset" id="resetFilter">Xóa bộ lọc</button>
        </div>
      </article>

      <article id="table">
        <table>
          <thead>
            <tr>
              <th>Phim</th>
              <th>Rạp</th>
              <th>Phòng</th>
              <th>Ngày</th>
              <th>Giờ</th>
              <th>Giá</th>
              <th>Ghế trống</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="film">
          </tbody>
        </table>
      </article>

     </section>
  </main>
</div>

<dialog id="screeningEditor" class="form-dialog" aria-labelledby="screeningTitle">
<button type="button" class="dialog-close" aria-label="Đóng" onclick="document.getElementById('movieReset').click()">×</button>
<form id="screeningForm">
            <div>
                <h2 id="screeningTitle">Thêm suất chiếu mới</h2>
            </div>
            <div>
                <label for="movieSelect">Phim:</label>
                <select id="movieSelect" required>
                    <option value="">Chọn phim</option>
                </select>
            </div>
            <div>
                <label for="theaterSelect">Rạp chiếu:</label>
                <select id="theaterSelect" required>
                    <option value="">Chọn rạp</option>
                </select>
            </div>
                <label for="roomSelect">Phòng chiếu:</label>
                <select id="roomSelect" required>
                    <option value="">Chọn phòng</option>
                </select>
            <div class="input">
                <label for="showDate">Ngày chiếu:</label>
                <input type="date" id="screeningDate" required>
            </div>
            <div class="input">
                <label for="showTime">Giờ chiếu:</label>
                <input type="time" id="showTime" required>
            </div>
            <div class="input">
                <label for="ticketPrice">Giá vé:</label>
                <input type="number" id="ticketPrice" placeholder="Nhập giá vé" min="0" step="1000" required>
            </div>
            <div>
                <button type="submit" id="movieSubmit">Tạo mới</button>
                <button type="button" id="movieReset">Hủy</button>
            </div>
            </form>
</dialog>
<script src="../../shared-state.js"></script>
<script src="app.js"></script>
<script src="../../form-dialog.js"></script>
</body>
</html>
