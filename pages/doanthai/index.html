<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Quản lý Rạp Chiếu Phim</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="suatchieu.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="embedded">


<div class="main-wrapper">
  <main class="content" id="mainContent">
    <!-- nội dung trang ở đây -->
     <section>
      <article id="header">
        <h2>Quản lý suất chiếu</h2>
        <button id="add"><i class="bi bi-plus-lg" aria-hidden="true"></i> Thêm suất chiếu mới</button>
      </article>

      <article id="filter">
        <div class="filterSelections">
          <label for="showDate">Ngày chiếu:</label>
          <input type="date" id="showDate">
        </div>
        <div class="filterSelections">
          <label for="movie">Phim:</label>
          <select type="text" id="movie">
            <option value="">Tất cả phim:</option>
          </select>
        </div>
        <div class="filterSelections">
          <label for="cinema">Rạp chiếu:</label>
          <select type="text" id="cinema">
            <option value="">Tất cả rạp</option>
          </select>
        </div>
        <div>
          <button type="reset" id="resetFilter">Xóa bộ lọc</button>
        </div>
      </article>

      <article id="table">
        <table>
          <thead>
            <tr>
              <th>Phim</th>
              <th>Rạp</th>
              <th>Phòng</th>
              <th>Ngày</th>
              <th>Giờ</th>
              <th>Giá</th>
              <th>Ghế trống</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="film">
          </tbody>
        </table>
      </article>

     </section>
  </main>
</div>

<script src="../../shared-state.js"></script>
<script src="app.js"></script>
</body>
</html>
