<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Quản lý Rạp Chiếu Phim</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="suatchieu.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <i class="bi bi-camera-reels-fill"></i>
    </div>
    <span class="logo-text">Quản Trị</span>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
      <i class="bi bi-list"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a class="nav-item active" href="#" data-page="dashboard" id="nav-dashboard">
      <i class="bi bi-grid-1x2 nav-icon"></i>
      <span class="nav-label">Tổng quan</span>
    </a>
    <a class="nav-item" href="#" data-page="movies" id="nav-movies">
      <i class="bi bi-film nav-icon"></i>
      <span class="nav-label">Phim</span>
    </a>
    <a class="nav-item" href="#" data-page="genres" id="nav-genres">
      <i class="bi bi-tags nav-icon"></i>
      <span class="nav-label">Thể loại</span>
    </a>
    <a class="nav-item" href="#" data-page="showtimes" id="nav-showtimes">
      <i class="bi bi-calendar-event nav-icon"></i>
      <span class="nav-label">Suất chiếu</span>
    </a>
    <a class="nav-item" href="#" data-page="theaters" id="nav-theaters">
      <i class="bi bi-building nav-icon"></i>
      <span class="nav-label">Rạp chiếu</span>
    </a>
    <a class="nav-item" href="#" data-page="products" id="nav-products">
      <i class="bi bi-bag nav-icon"></i>
      <span class="nav-label">Sản phẩm</span>
    </a>
    <a class="nav-item" href="./folder-name/index.html" data-page="bookings" id="nav-bookings">
      <i class="bi bi-ticket-perforated nav-icon"></i>
      <span class="nav-label">Đặt vé</span>
    </a>
    <a class="nav-item" href="#" data-page="users" id="nav-users">
      <i class="bi bi-people nav-icon"></i>
      <span class="nav-label">Người dùng</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">QT</div>
      <span class="user-name">Quản trị viên</span>
    </div>
    <button class="btn-logout" id="btnLogout" title="Đăng xuất">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>

<div class="main-wrapper">
  <main class="content" id="mainContent">
    <!-- nội dung trang ở đây -->
     <section>
      <article id="header">
        <h2>Quản lý suất chiếu</h2>
        <button id="add">+ Thêm suất chiếu mới</button>
      </article>

      <article id="filter">
        <div class="filterSelections">
          <label for="showDate">Ngày chiếu:</label>
          <input type="date" id="showDate">
        </div>
        <div class="filterSelections">
          <label for="movie">Phim:</label>
          <select type="text" id="movie">
            <option value="">Tất cả phim:</option>
          </select>
        </div>
        <div class="filterSelections">
          <label for="cinema">Rạp chiếu:</label>
          <select type="text" id="cinema">
            <option value="">Tất cả rạp</option>
          </select>
        </div>
        <div>
          <button type="reset" id="resetFilter">Xóa bộ lọc</button>
        </div>
      </article>

      <article id="table">
        <table>
          <thead>
            <tr>
              <th>Phim</th>
              <th>Rạp</th>
              <th>Phòng</th>
              <th>Ngày</th>
              <th>Giờ</th>
              <th>Giá</th>
              <th>Ghế trống</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="film">
          </tbody>
        </table>
      </article>

     </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
