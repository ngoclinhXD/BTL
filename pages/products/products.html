<!-- Tiêu đề trang -->
<div class="page-header">
    <div class="header-info">
        <h2 class="page-title">Quản lý Sản phẩm</h2>
        <div class="breadcrumb">
            <span>Tổng quan</span> <i class="bi bi-chevron-right"></i> <span class="active">Sản phẩm</span>
        </div>
    </div>
</div>

<!-- Khối Bảng dữ liệu chính -->
<div class="card">
    <!-- Tool bar -->
    <div class="card-header">
        
        <!-- thanh tìm kiếm và custom dropdown -->
        <div class="header-actions-left">
            <div class="search-box">
                <i class="bi bi-search"></i>
                <input type="text" id="search-product" placeholder="Tìm kiếm sản phẩm..." onkeyup="productPage.search()">
            </div>
            
            <div class="filter-box custom-dropdown">
                <!-- ẩn thẻ select thật đi -->
                <select id="filter-status" style="display: none;">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="active">Đang bán</option>
                    <option value="inactive">Ngừng bán</option>
                </select>
                
                <!-- Giao diện hiển thị Dropdown -->
                <div class="dropdown-selected" onclick="productPage.toggleDropdown()">
                    <span id="dropdown-text">Tất cả trạng thái</span>
                    <i class="bi bi-chevron-down"></i>
                </div>
                
                <!-- Danh sách lựa chọn -->
                <ul class="dropdown-options" id="dropdown-options">
                    <li onclick="productPage.selectOption('all', 'Tất cả trạng thái')">Tất cả trạng thái</li>
                    <li onclick="productPage.selectOption('active', 'Đang bán')">Đang bán</li>
                    <li onclick="productPage.selectOption('inactive', 'Ngừng bán')">Ngừng bán</li>
                </ul>
            </div>
        </div>

        <!-- nút thêm mới -->
        <div class="header-actions-right">
            <button class="btn btn-primary" onclick="productPage.openModal()">
                <i class="bi bi-plus-lg"></i> Thêm sản phẩm
            </button>
        </div>
    </div>

    <!-- Bảng danh sách sản phẩm -->
    <table class="data-table">
        <thead>
            <tr>
                <th>Ảnh</th>
                <th>Tên sản phẩm</th>
                <th>Danh mục</th>
                <th>Giá bán</th>
                <th>Tồn kho</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="product-table-body">
            <!-- nơi nhận dữ liệu sp từ jv -->
        </tbody>
    </table>
</div>

<!-- modal popup thêm/sửa sp -->
<div id="product-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-title">Thêm Sản phẩm mới</h3>
            <span class="close" onclick="productPage.closeModal()">&times;</span>
        </div>
        
        <form id="product-form" onsubmit="productPage.saveProduct(event)">
            <div class="modal-body">
                <input type="hidden" id="product-id">

                <div class="form-group">
                    <label>Tên sản phẩm</label>
                    <input type="text" id="product-name" placeholder="Nhập tên sản phẩm..." required>
                </div>
                
                <div class="form-group">
                    <label>Danh mục</label>
                    <select id="product-category">
                        <option value="Đồ ăn">Đồ ăn</option>
                        <option value="Nước uống">Nước uống</option>
                        <option value="Combo">Combo</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Mô tả sản phẩm</label>
                    <textarea id="product-desc" rows="3" placeholder="Nhập mô tả chi tiết..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Giá bán (VNĐ)</label>
                    <input type="number" id="product-price" placeholder="Ví dụ: 45000" required>
                </div>
                
                <div class="form-group">
                    <label>Số lượng tồn</label>
                    <input type="number" id="product-stock" placeholder="0" required>
                </div>
                
                <div class="form-group">
                    <label>URL Hình ảnh</label>
                    <input type="text" id="product-image" placeholder="https://...">
                </div>
                
                <div class="form-group">
                    <label>Trạng thái</label>
                    <select id="product-status">
                        <option value="active">Đang bán</option>
                        <option value="inactive">Ngừng bán</option>
                    </select>
                </div>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-icon" onclick="productPage.closeModal()">Hủy</button>
                <button type="submit" class="btn btn-primary">Lưu thông tin</button>
            </div>
        </form>
    </div>
</div>
