<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng quan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tongquan.css">
</head>
<body>

    <main>
    <header class="overview-header">
        <h1>Xin chào, <span>Quản trị viên.</span></h1>
        <time id="overviewDate" aria-label="Ngày và giờ hiện tại"></time>
    </header>
    <div class="stats-container">
        <a class="stat-card" href="../../../index.html#movies" target="_top">
            <div class="stat-icon">
                <i class="fa-solid fa-film"></i>
            </div>
            <div class="stat-content">
                <span class="stat-title">Tổng số phim</span>
                <span class="stat-number" id="totalMovies">0</span>
            </div>
        </a>

        <a class="stat-card" id="showingLink" href="../../../index.html#theaters" target="_top">
            <div class="stat-icon">
                <i class="fa-solid fa-ticket"></i>
            </div>
            <div class="stat-content">
                <span class="stat-title">Đang chiếu</span>
                <span class="stat-number" id="showingMovies">0</span>
            </div>
        </a>

        <a class="stat-card" href="../../../index.html#booking" target="_top">
            <div class="stat-icon">
                <i class="fa-solid fa-credit-card"></i>
            </div>
            <div class="stat-content">
                <span class="stat-title">Tổng đặt vé</span>
                <span class="stat-number" id="totalBookings">0</span>
            </div>
        </a>

        <div class="stat-card">
            <div class="stat-icon">
                <i class="fa-solid fa-users"></i>
            </div>
            <div class="stat-content">
                <span class="stat-title">Người dùng</span>
                <span class="stat-number">3</span>
            </div>
        </div>
    </div>
    </main>
    <script src="../../../shared-state.js"></script>
    <script src="tongquan.js"></script>

</body>
</html>
