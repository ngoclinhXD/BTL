<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login user</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="card">
    <h2>Đăng Nhập</h2>
    <form id="loginForm">
        <div class="group">
            <label for="username">Tên tài khoản</label>
            <input id="username" type="text" placeholder="Nhập tên tài khoản..." autocomplete="username" required>
        </div>

        <div class="group">
            <label for="password">Mật khẩu</label>
            <input id="password" type="password" placeholder="Nhập mật khẩu..." autocomplete="current-password" required minlength="6">
            <div class="error">Mật khẩu phải từ 6 ký tự trở lên.</div>
        </div>

        <div class="error" id="loginError" role="alert">Tên tài khoản hoặc mật khẩu không đúng.</div>
        <button type="submit">Đăng nhập</button>
    </form>
</div>

<script src="./login.js"></script>
</body>
</html>
