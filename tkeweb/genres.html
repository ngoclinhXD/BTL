<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Quản lý Rạp Chiếu Phim</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <i class="bi bi-camera-reels-fill"></i>
    </div>
    <span class="logo-text">Quản Trị</span>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
      <i class="bi bi-list"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a class="nav-item" href="index.html" data-page="dashboard" id="nav-dashboard">
      <i class="bi bi-grid-1x2 nav-icon"></i>
      <span class="nav-label">Tổng quan</span>
    </a>
    <a class="nav-item" href="movies.html" data-page="movies" id="nav-movies">
      <i class="bi bi-film nav-icon"></i>
      <span class="nav-label">Phim</span>
    </a>
    <a class="nav-item active" href="genres.html" data-page="genres" id="nav-genres">
      <i class="bi bi-tags nav-icon"></i>
      <span class="nav-label">Thể loại</span>
    </a>
    <a class="nav-item" href="#" data-page="showtimes" id="nav-showtimes">
      <i class="bi bi-calendar-event nav-icon"></i>
      <span class="nav-label">Suất chiếu</span>
    </a>
    <a class="nav-item" href="#" data-page="theaters" id="nav-theaters">
      <i class="bi bi-building nav-icon"></i>
      <span class="nav-label">Rạp chiếu</span>
    </a>
    <a class="nav-item" href="#" data-page="products" id="nav-products">
      <i class="bi bi-bag nav-icon"></i>
      <span class="nav-label">Sản phẩm</span>
    </a>
    <a class="nav-item" href="./folder-name/index.html" data-page="bookings" id="nav-bookings">
      <i class="bi bi-ticket-perforated nav-icon"></i>
      <span class="nav-label">Đặt vé</span>
    </a>
    <a class="nav-item" href="#" data-page="users" id="nav-users">
      <i class="bi bi-people nav-icon"></i>
      <span class="nav-label">Người dùng</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">QT</div>
      <span class="user-name">Quản trị viên</span>
    </div>
    <button class="btn-logout" id="btnLogout" title="Đăng xuất">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>

<div class="main-wrapper">
  <main class="content" id="mainContent">
    <section id="genresPage"> 
      <p id="genreNotice" role="status"></p>
      <div class="heading">
        <h2>Quản lý thể loại phim</h2>
        <button class="primary" id="addGenre" type="button">Thêm thể loại mới +</button>
      </div>
      <div id="genresList">
        <div class="filters">
          <input
            id="genreSearch"
            type="search"
            placeholder="Tìm kiếm thể loại..."
            aria-label="Tìm kiếm thể loại">
        </div>

        <div class="table-wrap">
          <table class="genres-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Tên thể loại</th>
                <th>Mô tả</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="genresTable"></tbody>
          </table>
        </div>
      </div>

      <div class="genre-card" id="genreEditor" hidden>
        <h3 id="genreFormTitle">Thêm thể loại</h3>

        <form id="genreForm">
          <label for="genreName">Tên thể loại</label>
          <input id="genreName" required maxlength="100">

          <label for="genreDescription">Mô tả</label>
          <textarea id="genreDescription" rows="4" maxlength="1000"></textarea>

          <div class="genre-form-actions">
            <button class="primary" id="saveGenre" type="submit">Thêm mới</button>
            <button class="genre-cancel" id="cancelGenre" type="button">Hủy</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
